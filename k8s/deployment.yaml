apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo-apps
  labels:
    app: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      serviceAccountName: demo-app
      containers:
        - name: app
          image: python:3.12-slim
          command: ["python", "-u", "/app/app.py"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: VAULT_ADDR
              value: "https://vault.example.com"
            - name: VAULT_NAMESPACE
              value: "apps"
            - name: VAULT_AUTH_MOUNT
              value: "kubernetes"
            - name: VAULT_ROLE
              value: "demo-app"
            - name: VAULT_AWS_MOUNT
              value: "aws-demo"
            - name: VAULT_STATIC_ROLE
              value: "demo-app"
            - name: VAULT_DYNAMIC_ROLE
              value: "dynamic-sts"
            - name: AWS_REGION
              value: "us-east-1"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: code
          configMap:
            name: demo-app-code
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: demo-apps
spec:
  selector:
    app: demo-app
  ports:
    - port: 8080
      targetPort: 8080
      name: http
